name: Release

on:
  # Tag per Terminal gepusht oder Release in der GitHub-Oberfläche veröffentlicht.
  # "v0.3.0" und "0.3.0" (auch Kurzform "0.3") werden akzeptiert.
  push:
    tags: ["v[0-9]*", "[0-9]*"]
  release:
    types: [published]

# Löst beides für denselben Tag aus, laufen die beiden Läufe nacheinander statt gleichzeitig
concurrency:
  group: release-${{ github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Version prüfen
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Kurzform 0.3 entspricht 0.3.0
          if [ "$(echo "$TAG" | tr -cd . | wc -c)" = "1" ]; then TAG="$TAG.0"; fi
          CODE="$(python -c 'import dia_assistent; print(dia_assistent.__version__)')"
          if [ "$TAG" != "$CODE" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zu __version__ $CODE in dia_assistent/__init__.py" >&2
            exit 1
          fi
      - name: Archiv bauen
        run: |
          NAME="dia-assistent-${GITHUB_REF_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${NAME}/" -o "dist/${NAME}.tar.gz" HEAD
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true
